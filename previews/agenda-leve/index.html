<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview A - Agenda Leve RTG</title><style>
:root{--navy:#0f2a4d;--gold:#c89d2d;--cyan:#2f80ed;--line:#dbe6f2;--bg:#f6f8fb;--text:#172033}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}.shell{padding:24px}.top{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px}.eyebrow{color:var(--gold);font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}h1{margin:4px 0 0;color:var(--navy);font-size:26px}.note{max-width:620px;color:#64748b;font-size:13px;line-height:1.45}
.board{display:grid;grid-template-columns:150px repeat(6,minmax(330px,1fr));overflow:auto;border:1px solid var(--line);border-radius:18px;background:white;box-shadow:0 20px 46px rgba(15,42,77,.08)}.corner,.person{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.corner{left:0;z-index:6;padding:14px;color:var(--navy);font-weight:950;border-right:1px solid var(--line)}.person{padding:12px;border-right:1px solid var(--line)}.person strong{color:var(--navy);font-size:14px}.pill{float:right;padding:4px 8px;border-radius:99px;background:#edf4fb;color:#1f4f82;font-size:11px;font-weight:950}.bar{height:5px;background:#edf4fb;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold))}
.row{display:contents}.day{position:sticky;left:0;z-index:4;display:grid;align-content:center;padding:14px;background:#edf4fb;border-right:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:inset -3px 0 0 var(--gold)}.day strong{color:var(--navy);font-size:13px;text-transform:uppercase;letter-spacing:.06em}.day span{margin-top:4px;color:#64748b;font-size:12px;font-weight:850}
.cell{min-height:430px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fbfdff}.bucket{height:402px;display:grid;grid-template-rows:auto 1fr auto;border:1px solid #d5e0ec;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 9px 20px rgba(15,42,77,.07)}.buckethead{padding:8px 10px;background:#f7fbff;border-bottom:1px solid #e6edf6;display:flex;justify-content:space-between;align-items:center}.buckethead b{font-size:12px;color:var(--navy)}.buckethead small{font-size:10px;color:#8a6b1d;font-weight:950;text-transform:uppercase}.list{display:grid;align-content:start;gap:8px;padding:8px;overflow:auto;scrollbar-width:thin;scrollbar-color:#8fb1d4 #eef4fb}.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-track{background:#eef4fb;border-radius:99px}.list::-webkit-scrollbar-thumb{background:#8fb1d4;border-radius:99px}
.item{display:grid;grid-template-columns:1fr;gap:8px;align-items:start;padding:9px 10px;border:1px solid #e4ebf4;border-left:3px solid var(--gold);border-radius:10px;background:#fff}.check{display:none;width:16px;height:16px;border:2px solid var(--cyan);border-radius:5px;margin-top:1px}.txt strong{display:block;color:var(--navy);font-size:12px;line-height:1.25}.txt span{display:block;margin-top:3px;color:#69788c;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:grid;gap:3px;justify-items:end;color:#7d8da3;font-size:10px;font-weight:900}.meta b{color:#8a6b1d}.actions{display:flex;gap:6px;padding:8px;border-top:1px solid #e6edf6;background:#fbfdff}.actions button,.add{flex:1;border:1px solid #d7e2ef;border-radius:9px;background:#fff;color:var(--navy);font-size:11px;font-weight:900;padding:7px}.detail{display:none;margin:0 8px 8px;padding:8px;border:1px dashed #c7d7e8;border-radius:10px;background:#f8fbff;color:#64748b;font-size:11px}.detail b{color:var(--navy)}
</style></head><body class="leve"><main class="shell"><div class="top"><div><span class="eyebrow">Preview A</span><h1>Agenda Leve RTG</h1></div><p class="note">Mantém lógica atual com campos visíveis, mas em visual claro, colunas largas e cards menos pesados.</p></div><section id="board" class="board"></section></main><script>
const people=['Bruno','Felipe','Gabrielle','Maicon','Pedro','Vitor'];
const days=['Segunda','Terca','Quarta','Quinta','Sexta'];
const discs=['EST','ARQ','ELE','HID','CLI','COM'];
const tasks={Bruno:['PPCI terreo','SPDA cobertura','Revisar ARQ base','Compat. shafts'],Felipe:['Validar EST','Rodada COMP','Planejar semana','Review entregas'],Gabrielle:['Pontos ELE','Quadros','Circuitos tipo','Compat. luminarias'],Maicon:['Barrilete','Prumadas HID','Detalhe reservatorio','Checklist esgoto'],Pedro:['Carga termica','Dutos pav. tipo','Compat. exaustao','Memorial CLI'],Vitor:['Atualizar COM','Notas cliente','Compat. infraestrutura','Revisar prancha']};
const board=document.getElementById('board');
function taskHtml(p,pi,t,k){return `<div class="item"><i class="check"></i><div class="txt"><strong>${t}</strong><span>SORDELLO 2 - ${discs[pi]} - Executivo</span></div><div class="meta"><b>${2+k}h</b><span>${k%2} notas</span></div></div>`}
board.innerHTML='<div class="corner">Dia</div>'+people.map((p,i)=>`<div class="person"><strong>${p}</strong><span class="pill">${24+i*2}h / 40h</span><div class="bar"><i style="width:${55+i*7}%"></i></div></div>`).join('')+days.map((d,di)=>`<div class="row"><div class="day"><strong>${d}</strong><span>${String(3+di).padStart(2,'0')}/08</span></div>${people.map((p,pi)=>`<div class="cell"><article class="bucket"><header class="buckethead"><b>${p}</b><small>${d}</small></header><div class="list">${tasks[p].concat(tasks[p],tasks[p].slice(0,(di+pi)%3)).map((t,k)=>taskHtml(p,pi,t,k)).join('')}</div><div class="detail"><b>Modo edição:</b> abrir ao clicar na tarefa, mantendo o quadro limpo.</div><footer class="actions"><button>+ tarefa</button><button>notas</button><button>expandir</button></footer></article></div>`).join('')}</div>`).join('');
</script></body></html>
